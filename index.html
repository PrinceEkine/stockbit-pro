
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <title>StockBit Pro - Inventory Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          },
        },
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
          --sat: env(safe-area-inset-top);
          --sar: env(safe-area-inset-right);
          --sab: env(safe-area-inset-bottom);
          --sal: env(safe-area-inset-left);
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        /* Mobile safe area padding */
        .safe-pb { padding-bottom: var(--sab); }
        .safe-pt { padding-top: var(--sat); }

        @media print {
            .no-print, nav, header, aside, .fixed, .modal-backdrop, button, .no-print * { 
                display: none !important; 
            }
            
            #root, #root > div, main, .flex-1 { 
                display: block !important; 
                padding: 0 !important; 
                margin: 0 !important;
                border: none !important;
                background: white !important;
            }
            
            .print-only { 
                display: block !important; 
                visibility: visible !important;
                position: relative !important;
                width: 100% !important;
            }

            body { 
                background: white !important; 
                color: black !important; 
                padding: 0 !important; 
                margin: 0 !important; 
            }

            @page {
                margin: 0;
            }

            .receipt-print {
                width: 72mm;
                margin: 0 auto;
                padding: 5mm 0;
                font-family: 'Courier New', Courier, monospace;
                font-size: 10px;
                line-height: 1.2;
                color: black;
                background: white;
                text-transform: uppercase;
            }
        }
        
        .print-only { display: none; }
        
        .dark body {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Smooth camera transition */
        .video-container video {
          object-fit: cover;
          width: 100%;
          height: 100%;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.90.1"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
